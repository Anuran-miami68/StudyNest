    <h2>StudyNest</h2>
    <p>One place to study, and one tap when you&#39;re stuck.</p>
  </section>
  <section class="sp-form">
    <svg class="sp-plane" viewBox="0 0 220 90"><path d="M0 84C60 92 120 44 168 30" fill="none" stroke="#0a9de8" stroke-width="2" stroke-dasharray="3 6"/><path d="M166 34l40-24-12 34-10-8-8 12-4-14z" fill="#0a9de8"/></svg><svg class="sp-bl" viewBox="0 0 300 130"><g fill="#0a9de8"><path d="M20 130V74h260v56z"/><path d="M8 74L150 22l142 52z"/><rect x="132" y="8" width="36" height="20" rx="3"/></g><circle cx="150" cy="52" r="9" fill="#fff"/><rect x="46" y="84" width="14" height="46" fill="#fff"/><rect x="86" y="84" width="14" height="46" fill="#fff"/><rect x="126" y="84" width="14" height="46" fill="#fff"/><rect x="166" y="84" width="14" height="46" fill="#fff"/><rect x="206" y="84" width="14" height="46" fill="#fff"/><rect x="246" y="84" width="14" height="46" fill="#fff"/><path d="M132 130v-26a18 18 0 0 1 36 0v26z" fill="#fff"/></svg><svg class="sp-br" viewBox="0 0 150 190"><g fill="#0a9de8"><rect x="40" y="40" width="70" height="150"/><path d="M32 40L75 6l43 34z"/></g><circle cx="75" cy="76" r="20" fill="#fff"/><path d="M75 62v14l9 6" stroke="#0a9de8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="62" y="116" width="26" height="74" rx="13" fill="#fff"/></svg>
    <a class="sp-back" href="index.html">← Back to home</a>
    <div class="sp-box">
      <h1>Join us</h1>
      <p class="sub">Create your free account</p>
      <div class="form-msg" id="signupMsg"></div>
    <form id="signupForm" novalidate>
    <div class="role-toggle"><label><input type="radio" name="role" value="student" checked><span>I&#39;m a Student</span></label><label><input type="radio" name="role" value="teacher"><span>I&#39;m a Teacher</span></label></div>
    <div class="fld"><span class="fl">Full name</span><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></span><input type="text" id="name" name="name" placeholder="Your full name" required autocomplete="name"></div>
    <div class="fld"><span class="fl">Email Id</span><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg></span><input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email"></div>
    <div class="fld"><span class="fl">Password</span><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><input type="password" id="password" name="password" placeholder="At least 6 characters" required autocomplete="new-password"></div>
    <div class="fld"><span class="fl">Confirm password</span><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><input type="password" id="confirm" name="confirm" placeholder="Re-enter password" required autocomplete="new-password"></div>
    <button type="submit" class="sp-btn">CREATE ACCOUNT</button>
    </form>
      <p class="sp-alt">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </section>
</div>
<script src="js/main.js"></script>
